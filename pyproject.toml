[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mo-bot"
version = "0.1.0"
description = "Persistent PR review service with reusable Codex sessions"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mo-bot = "mo_bot.cli:main"
mo-botctl = "mo_bot.client:main"

[tool.setuptools.packages.find]
include = ["mo_bot*"]
