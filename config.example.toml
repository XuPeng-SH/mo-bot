[service]
id = "mo-bot-local"
state_dir = "~/.local/state/mo-bot"
poll_seconds = 300

[review]
repository = "OWNER/REPO"
reviewer = "YOUR_GITHUB_LOGIN"
source_dir = "~/src/repository"
# Optional custom discovery policy; bundled policy is the default.
# queue_script = "~/custom/review_queue.py"
sessions = 2
model = "gpt-6-astra"
reasoning_effort = "xhigh"
exclude = []
stale_ci_days = 14
max_recoveries = 2
job_timeout_seconds = 7200
command_timeout_seconds = 45
minimum_free_gib = 20
codex = "codex"
gh = "gh"

[api]
host = "127.0.0.1"
port = 8989

# Optional creation defaults for individual slots. SQLite preserves later API changes.
# [[session]]
# slot = 0
# model = "gpt-6-astra"
# reasoning_effort = "xhigh"

# Separate delivery pool. Zero preserves review-only deployments.
[worker]
sessions = 0
classifier_sessions = 1
model = "gpt-6.1-sol"
reasoning_effort = "low"
# Bundled issue-to-pr + mo-bot-worker are always loaded. No home skill path needed.
# Optional additional custom instructions:
# issue_skill = "~/custom/issue-to-pr/SKILL.md"
correction_rounds = 2
# Bounds active/completed tasks and attempts for an identical frozen input.
tasks_per_head = 4
reruns_per_head = 2
scan_limit = 20
# Shared non-default head repositories require explicit authorization.
allowed_head_repos = []
# Worker slot overrides use role="worker", slot=pool index. Stable global IDs
# are visible in /api/sessions; resizing review sessions never renumbers workers.

# Optional SSH model host. Python 3, signed-in compatible Codex and known_hosts
# are required remotely; source, tests and SQLite remain on the coordinator.
# [[node]]
# name = "remote-worker"
# ssh = "user@worker-host"
# codex = "codex"
# [node.env]
# https_proxy = "http://proxy-host:1080"
# http_proxy = "http://proxy-host:1080"
# [[session]]
# role = "worker"
# slot = 1  # requires [worker] sessions >= 2; this is the pool index
# node = "remote-worker"
